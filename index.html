{cat:'Game plan',id:'zones',name:'Attack zones',type:'info',blurb:'Where you are on the park decides what you do next.',
 html:`<svg class="zones" viewBox="0 0 700 200">

  <g fill="#fff" font-family="ui-sans-serif,system-ui" font-weight="800" font-size="22" letter-spacing="3">
    <text x="70" y="95">RED</text><text x="292" y="95">AMBER</text><text x="530" y="95">GREEN</text>
  </g>
  <g fill="rgba(255,255,255,.7)" font-family="ui-sans-serif,system-ui" font-size="13">
    <text x="70" y="120">our 22</text><text x="292" y="120">22 to their 10m</text><text x="530" y="120">their half</text>
  </g>
  <g fill="var(--amber)" font-family="ui-sans-serif,system-ui" font-size="13" font-weight="700">
    <text x="640" y="180">→ attack</text>
  </g>
 </svg>
 <h3>Red — inside our own 22</h3>
 <p><b>Phase 1:</b> long kick (10 or 15). Forward play, <b>Chaos</b> move to get the angle on the kick. The kick must find touch. Nothing else happens in red — get out.</p>
 <h3>Amber — our 22 to their 10m</h3>
 <ul><li><b>1.</b> Off lineout or scrum, Pod 1 attacks midfield with 12/13.</li>
 <li><b>2.</b> Four forwards round the corner. 10 decides if it comes off 9 or off 10.</li>
 <li><b>3.</b> Ball to 10 — look for space, gaps, mismatches (backs on forwards). Hands or kick, but a kick must go to space and touch grass.</li>
 <li><b>4.</b> Play each phase as it comes: forwards then backs. Heads-up rugby.</li>
 <li><b>5.</b> 10 decides — keep going the same way or come back the way the ball came. We keep the ball until we're over the line.</li></ul>
 <h3>Green — their half</h3>
 <ul><li><b>1.</b> Pod 1 attacks midfield.</li>
 <li><b>2.</b> Four forwards round the corner (10 calls off 9 or off 10).</li>
 <li><b>3.</b> Attack wide to the 15m channel. Option 1: keep the ball alive — <b>arrowheads</b>. Option 2: if contact is made, quick ruck and get it back in play.</li>
 <li><b>4.</b> Next four forwards hit up — <b>lions</b>.</li>
 <li><b>5.</b> Heads-up rugby, same as amber.</li></ul>
 <h3>Arrowheads</h3>
 <p>When the ball carrier breaks, support angles in behind him in an arrowhead. He then has a man on both sides — either to take the pass, or to hit the tackle/ruck.</p>
 <h3>Plan B / Plan C</h3>
 <p><b>Plan B:</b> back to phase two and rebuild the phases.<br>
 <b>Plan C:</b> kick to the corners, ball out of play. Then squeeze them retrieving it. Always put pressure on every opposition restart — it stops them building phases and cuts down their options.</p>
 <h3>Called but never described</h3>
 <p>Two things are named in the playbook without being explained anywhere in it, so they aren't drawn here: <b>LION / LIONS</b> (green zone phase 4, and the next phase off a received kick-off) and the second tryline line-out code <b>H: 1 356 748</b>, which is listed with nothing after it. Worth getting both off the coach.</p>
 <h3>The aim</h3>
 <p>Get into their half and take every point on offer first. Build a lead, keep the scoreboard ticking. Once we're ahead, then we go hunting the bonus-point tries.</p>`},

 <p>Tell the forwards where the strike move is going on the next phase, so they set the platform in the right place.</p>
 <ul><li><code>C</code> close</li><li><code>M</code> middle</li><li><code>S</code> spread</li></ul>
 <h3>Non-negotiable</h3><p>Every play is run <b>on the gain line</b>. Deep and flat-footed asks the defence nothing.</p>`},

/* ============ LINEOUT ============ */
{cat:'Lineout',id:'locodes',name:'Line-out codes',type:'info',blurb:'How to read the number, and what the letters change.',
 html:`<h3>The number</h3>
 <p>Four digits. Only the <b>middle two</b> mean anything: the first of them is the <b>jersey of the jumper</b>, the second is <b>where in the line-out the ball goes</b> — front = 1, middle = 2, back = 3.</p>
 <p><code>7514</code> → jumper <b>5</b>, space <b>1</b> (front). Ball off the top, straight to 9. The 7 and the 4 are noise.</p>
 <h3>The prefix changes the ball</h3>
 <ul>
 <li>A <b>colour</b> = lob ball. <code>Red 7514</code> — the jumper steps one forward, then two back.</li>
 <li>Starts with <b>S</b> = switch ball.</li>
 <li>Starts with <b>D</b> = catch and drive.</li>
 <li>Starts with <b>P</b> / <code>POCKET</code> = pocket ball. The jumper returns to ground and pops it to a runner or to 9.</li>
 </ul>
 <h3>How we move</h3>
 <p>All movement goes <b>down the middle</b> of the line-out. If the middle jumper is going to the front, he travels straight forward, the others step out of the space and fill in behind him, and his lifter follows. Everything stays dynamic and quick.</p>
 <p>The thrower throws, <b>then</b> the jumper goes up to meet it in the air — that stops them getting up before us.</p>
 <h3>10 call</h3>
 <p>Called by the jumper. If the opposition are sleeping, quick ball to 1 in the line-out and we're away.</p>
 <h3>Standards</h3>
 <ul><li>Quick and dynamic, every time.</li><li>Nobody back-pedals — turn, run back to your position, then lift.</li>
 <li>Beat them by being there first. If they're not ready, get the ball in.</li><li>Keep the tempo of the game high.</li></ul>`},

{cat:'Lineout',id:'defence_lo',name:'Defending a line-out',type:'formation',
 blurb:'Two pods, and the BLITZ option.',players:LINEOUT(['2A','4A','1A','3B','5B','6B']),
 html:`<h3>Full line-out</h3>
 <p>Organise into two pods, each with two lifters and a jumper. The letter on each man is his pod.</p>
 <ul><li><b>Pod A:</b> 2, 4 and 1</li><li><b>Pod B:</b> 3, 5 and 6</li></ul>
 <h3>If they shorten it</h3>
 <p>9 stands at the front of the line-out and our jumper takes the 9 position. When the ball is thrown, the jumper steps into the space it's going to and competes. 9 sweeps round behind.</p>
 <h3>BLITZ</h3>
 <p>We don't compete for the throw at all. We sack their catcher the second he touches the deck. The two players either side of the sacker drive through between their lifters and the catcher as soon as they land. No drive, no play, and they're slowed right down.</p>`},

{cat:'Defence',id:'defprinciples',name:'Defence principles',type:'info',
 blurb:'Our mindset in defence is to regain possession.',
 html:`<h3>Line speed</h3>
 <p>Dynamic for the <b>first three steps — zoom, paddle, zoom</b>. That closes the space, limits the carrier's options, and stops him getting up to speed, which makes him far easier to tackle.</p>
 <h3>Chop, lock and block</h3>
 <p>We want a <b>double tackle</b> most of the time to stop the offload.</p>
 <ul><li><b>Chop</b> — first man takes the legs.</li>
 <li><b>Lock</b> — second man locks up the ball, watching his height.</li>
 <li><b>Block</b> — third man blocks the offload or gets beyond the ball at the ruck.</li></ul>
 <p>Even when we don't win it, that slows their ball and buys us time to set for the next phase.</p>
 <h3>Make them run around us</h3>
 <p>Close the space. Only drift when the man <b>outside</b> your man passes the ball — and shut down the pass back into your channel.</p>
 <h3>Pendulum</h3>
 <p>Against kicks and wide attacks, wingers and full back work together to give us width and depth at the same time.</p>
 <h3>Forwards: do not honey pot</h3>
 <p>Work hard to get into the line. There should <b>never be more than three defenders</b> in one tackle — we want more men on their feet than they have.</p>
 <h3>Do not sell out your team-mates</h3>
 <p>Taking a breather and asking someone else to cover your space gives them an overlap somewhere. Every time.</p>
 <h3>Two calls</h3>
 <ul><li><b>LOST</b> (from 9) — leave the ball, get into a defensive line across the pitch.</li>
 <li><b>RESET</b> — repeat the call and take a step back to bring the line onside. <b>Cheap penalties are not acceptable.</b></li></ul>`},

{cat:'Defence',id:'counter',name:'Counter attack',type:'info',
 blurb:'What happens the moment we get it back — and the moment we kick it away.',
 html:`<h3>Tackle turnover</h3>
 <p>Ball to 10 as fast as possible, then played into space. Heads-up rugby.</p>
 <h3>They turn us over and kick</h3>
 <ul><li>Any three players drop back, retrieve it and make a three-man spread counter attack.</li>
 <li>Everyone else forms a defensive line to create the counter-attack doors.</li>
 <li>9 follows the ball to direct the attack after the first tackle.</li></ul>
 <h3>Paisley kick</h3>
 <ul><li>Three players drop back into a three-man spread in case they kick it straight back.</li>
 <li>Whoever is nearest the kicker chases, with two more — squeeze the receiver so his only options are take the tackle or kick.</li>

function pitchSVG(play){

  for(let y=0;y<=D;y+=5){

  }

    g.appendChild(el('line',{x1:sx(9),y1:0,x2:sx(9),y2:sy(0),stroke:'rgba(255,255,255,.2)','stroke-width':2,'stroke-dasharray':'5 9'}));
    g.appendChild(el('line',{x1:sx(19),y1:0,x2:sx(19),y2:sy(0),stroke:'rgba(255,255,255,.2)','stroke-width':2,'stroke-dasharray':'5 9'}));

    draw(0);
    if(play.html){const d=document.createElement('div');d.className='info';
      d.style.marginTop='12px';d.innerHTML=play.html;stage.appendChild(d);}
    return;
  }
  const tr=document.createElement('div');tr.className='transport';
  tr.innerHTML=`<button id="rew" aria-label="Restart">&#9198;</button>
    <button id="pp" class="main" aria-label="Play">&#9654;</button>
    <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Timeline">
    <button id="spd" class="spd">1&times;</button>`;
  stage.appendChild(tr);
  tr.querySelector('#rew').onclick=()=>{T=0;draw(T);setPlaying(true);};
  tr.querySelector('#pp').onclick=()=>setPlaying(!playing);
  tr.querySelector('#spd').onclick=e=>{rate=rate===1?.5:rate===.5?.25:1;
    e.currentTarget.innerHTML=(rate===1?'1':rate===.5?'&frac12;':'&frac14;')+'&times;';};
  tr.querySelector('#scrub').oninput=e=>{setPlaying(false);T=e.target.value/1000*C.dur;draw(T);};
  draw(0);
  const reduce=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  if(!reduce)setPlaying(true);
}

function setPlaying(v){
  playing=v;
  const b=document.getElementById('pp');
  if(b)b.innerHTML=v?'&#10073;&#10073;':'&#9654;';
  if(v){last=performance.now();if(!raf)raf=requestAnimationFrame(tick);}
}
function tick(now){
  raf=null;
  if(playing&&C){
    T+=(now-last)/1000*rate;last=now;
    if(T>=C.dur){T=C.dur;setPlaying(false);}
    draw(T);
  }
  if(playing)raf=requestAnimationFrame(tick);
}

/* Nodes are built once per play and only their attributes change each frame —
   rebuilding the whole layer every frame is what made the motion stutter. */
function buildNodes(C){
  const layer=document.getElementById('layer');
  if(!layer)return;
  while(layer.firstChild)layer.removeChild(layer.firstChild);
  const N={trails:[],marks:[],dummies:[],players:[],ballTrail:null,ball:null,misses:[],decoyTags:[]};
  const {players,play}=C;
  const decoyOf={};C.acts.forEach(a=>{if(a.type==='run'&&a.decoy)decoyOf[a.who]=a;});
  players.forEach(p=>{
    if(p.team!=='atk'||p.path.length<2)return;
    const isDecoy=!!decoyOf[p.id];
    const e=el('path',{fill:'none',stroke:isDecoy?'#F5A524':'#5FD3F3','stroke-width':isDecoy?2.2:2.5,
      'stroke-dasharray':isDecoy?'7 5':'1 6',opacity:isDecoy?.6:.75,'stroke-linecap':'round'});
    layer.appendChild(e);N.trails.push({p,e});
  });
  Object.keys(decoyOf).forEach(id=>{
    const tx=el('text',{'text-anchor':'middle',fill:'#F5A524','font-size':8.5,'font-weight':800,
      'letter-spacing':'1.2','font-family':'ui-sans-serif,system-ui',opacity:0});
    tx.textContent='DECOY';layer.appendChild(tx);N.decoyTags.push({p:C.byId[id],a:decoyOf[id],tx});
  });
  C.acts.forEach(a=>{
    if(a.type!=='pass'||!a.miss)return;
    const g=el('g',{opacity:0});
    g.appendChild(el('line',{stroke:'#F5A524','stroke-width':2.5,'stroke-linecap':'round'}));
    g.appendChild(el('polygon',{fill:'#F5A524'}));
    const tx=el('text',{'text-anchor':'middle',fill:'#F5A524','font-size':8.5,'font-weight':800,
      'letter-spacing':'1.2','font-family':'ui-sans-serif,system-ui'});
    tx.textContent='MISS';g.appendChild(tx);
    layer.appendChild(g);N.misses.push({a,g});
  });
  C.acts.forEach(a=>{
    if(a.type!=='mark')return;
    const g=el('g',{opacity:0});
    g.appendChild(el('circle',{cx:sx(a.x),cy:sy(a.y),r:13,fill:'none',
      stroke:'rgba(255,255,255,.35)','stroke-width':3,'stroke-dasharray':'3 5'}));
    const tx=el('text',{x:sx(a.x),y:sy(a.y)+4,'text-anchor':'middle',
      fill:'rgba(255,255,255,.5)','font-size':11,'font-weight':700,
      'font-family':'ui-sans-serif,system-ui'});
    tx.textContent=a.label||'';g.appendChild(tx);
    layer.appendChild(g);N.marks.push({a,g});
  });
  if(play.ballStart){
    N.ballTrail=el('path',{fill:'none',stroke:'#F5A524','stroke-width':3,opacity:.85,
      'stroke-linecap':'round','stroke-linejoin':'round'});
    layer.appendChild(N.ballTrail);
  }
  C.acts.forEach(a=>{
    if(a.type!=='dummy')return;
    const e=el('line',{stroke:'#F5A524','stroke-width':2.5,'stroke-dasharray':'2 7',opacity:0});
    layer.appendChild(e);N.dummies.push({a,e});
  });
  players.forEach(p=>{
    const g=el('g'),atk=p.team==='atk',set=p.team==='ruck'||p.team==='scrum';
    let ring=null;
    if(p.team==='ring'){
      g.appendChild(el('ellipse',{rx:38,ry:34,fill:'rgba(255,255,255,.04)',
        stroke:'rgba(255,255,255,.3)','stroke-width':2.5,'stroke-dasharray':'5 6'}));
      layer.appendChild(g);N.players.push({p,g,ring:null});return;
    }
    if(set){
      g.appendChild(el('circle',{r:p.r||15,fill:'rgba(255,255,255,.06)',
        stroke:'rgba(255,255,255,.35)','stroke-width':2.5,
        'stroke-dasharray':p.team==='ruck'?'4 5':''}));
      const t2=el('text',{y:p.r?-(p.r+5):4,'text-anchor':'middle',fill:'rgba(255,255,255,.55)',
        'font-size':9,'font-weight':800,'font-family':'ui-sans-serif,system-ui'});
      t2.textContent=p.team==='ruck'?'RUCK':'SCRUM';g.appendChild(t2);
    }else{
      if(C.acts.some(a=>a.type==='lift'&&a.who===p.id)){
        ring=el('circle',{r:13,fill:'none',stroke:'#F5A524','stroke-width':2.5,opacity:0});
        g.appendChild(ring);
      }
      const R=p.small?9:12;
      g.appendChild(el('circle',{r:R,fill:atk?'#EAF7FF':'#8E2438',
        stroke:atk?'#5FD3F3':'#E86B7F','stroke-width':p.small?2:2.5}));
      const t2=el('text',{y:p.small?3.5:4.5,'text-anchor':'middle',fill:atk?'#0A1620':'#FFE8EC',
        'font-size':p.small?8.5:(p.label.length>2?9.5:12),'font-weight':800,
        'font-family':'ui-sans-serif,system-ui'});
      t2.textContent=p.label;g.appendChild(t2);
    }
    layer.appendChild(g);N.players.push({p,g,ring});
  });
  if(play.ballStart){
    N.ball=el('circle',{fill:'#F5A524',stroke:'#0A1620','stroke-width':2,r:5});
    layer.appendChild(N.ball);
  }
  C.nodes=N;
}

function draw(t){
  if(!C||!C.nodes)return;
  const N=C.nodes,play=C.play;
  N.trails.forEach(({p,e})=>{
    let d='';
    for(let s=0;s<=70;s++){
      const q=posAt(p,t*s/70);
      d+=(s?'L':'M')+sx(q.x).toFixed(1)+' '+sy(q.y).toFixed(1)+' ';
    }
    e.setAttribute('d',d);
  });
  N.marks.forEach(({a,g})=>g.setAttribute('opacity',t>=a.t?1:0));
  if(N.ballTrail){
    let d='',started=false;
    for(let s=0;s<=60;s++){
      const b=ballAt(C,t*s/60);if(!b)continue;
      d+=(started?'L':'M')+sx(b.x).toFixed(1)+' '+sy(b.y).toFixed(1)+' ';started=true;
    }
    N.ballTrail.setAttribute('d',d);
  }
  N.decoyTags.forEach(({p,a,tx})=>{
    const on=t>=a.t-.1&&t<=a.t+a.d+.6;
    tx.setAttribute('opacity',on?.9:0);
    if(on){const q=posAt(p,t);tx.setAttribute('x',sx(q.x));tx.setAttribute('y',sy(q.y)-17);}
  });
  N.misses.forEach(({a,g})=>{
    const on=t>=a.t;
    g.setAttribute('opacity',on?.85:0);
    if(on){
      const f=posAt(C.byId[a.from],a.t),r=posAt(C.byId[a.to],a.t+a.d);
      const x1=sx(f.x),y1=sy(f.y),x2=sx(r.x),y2=sy(r.y);
      const L=Math.hypot(x2-x1,y2-y1)||1,ux=(x2-x1)/L,uy=(y2-y1)/L;
      const ex=x2-ux*14,ey=y2-uy*14;                      // stop short of the receiver
      g.children[0].setAttribute('x1',x1);g.children[0].setAttribute('y1',y1);
      g.children[0].setAttribute('x2',ex);g.children[0].setAttribute('y2',ey);
      const px=-uy,py=ux;
      g.children[1].setAttribute('points',(ex+ux*9)+','+(ey+uy*9)+' '+(ex+px*5)+','+(ey+py*5)+' '+(ex-px*5)+','+(ey-py*5));
      g.children[2].setAttribute('x',(x1+x2)/2+px*11);g.children[2].setAttribute('y',(y1+y2)/2+py*11+3);
    }
  });
  N.dummies.forEach(({a,e})=>{
    const on=t>=a.t&&t<=a.t+a.d+.25;
    e.setAttribute('opacity',on?.75:0);
    if(on){
      const f=posAt(C.byId[a.from],t),g2=posAt(C.byId[a.to],t);
      e.setAttribute('x1',sx(f.x));e.setAttribute('y1',sy(f.y));
      e.setAttribute('x2',sx(g2.x));e.setAttribute('y2',sy(g2.y));
    }
  });
  N.players.forEach(({p,g,ring})=>{
    const q=posAt(p,t);
    g.setAttribute('transform','translate('+sx(q.x).toFixed(1)+' '+sy(q.y).toFixed(1)+')');
    if(ring){
      const a=C.acts.find(x=>x.type==='lift'&&x.who===p.id&&t>=x.t&&t<=x.t+x.d+.3);
      if(a){const u=Math.min(1,(t-a.t)/(a.d+.3));
        ring.setAttribute('r',13+u*13);ring.setAttribute('opacity',1-u);}
      else ring.setAttribute('opacity',0);
    }
  });
  if(N.ball){
    const b=ballAt(C,t);
    if(b){N.ball.setAttribute('opacity',1);
      N.ball.setAttribute('cx',sx(b.x));N.ball.setAttribute('cy',sy(b.y));
      N.ball.setAttribute('r',(b.r*PX*.62).toFixed(1));}
    else N.ball.setAttribute('opacity',0);
  }
  const sc=document.getElementById('scrub');
  if(sc)sc.value=Math.round(t/C.dur*1000);
  const lis=document.querySelectorAll('#steps li');
  C.steps.forEach((s,i)=>{
    if(!lis[i])return;
    lis[i].classList.toggle('on',t>=s.t-.05&&t<=s.t+(s.d||0)+.5);
  });
}

/* ---------- UI ---------- */
const cats=[...new Set(PLAYS.map(p=>p.cat))];
const gpi=cats.indexOf('Game plan');if(gpi>0){cats.splice(gpi,1);cats.unshift('Game plan');}
let activeCat=cats[0];
const catBar=document.getElementById('cats'),chipBar=document.getElementById('plays');

function buildCats(){
  catBar.innerHTML='';
  cats.forEach(c=>{
    const b=document.createElement('button');b.textContent=c;
    b.setAttribute('aria-selected',c===activeCat);
    b.onclick=()=>{activeCat=c;buildCats();buildChips();select(PLAYS.find(p=>p.cat===c));};
    catBar.appendChild(b);
  });
}
function buildChips(){
  chipBar.innerHTML='';
  PLAYS.filter(p=>p.cat===activeCat).forEach(p=>{
    const b=document.createElement('button');b.textContent=p.name;b.dataset.id=p.id;
    b.onclick=()=>select(p);chipBar.appendChild(b);
  });
}
function select(p){
  if(!p)return;
  document.querySelectorAll('#plays button').forEach(b=>
    b.setAttribute('aria-selected',b.dataset.id===p.id));
  setPlaying(false);
  document.getElementById('pname').innerHTML=p.name.replace(/^(\w)/,'<em>$1</em>');
  document.getElementById('pblurb').textContent=p.blurb||'';
  const ol=document.getElementById('steps');ol.innerHTML='';
  const note=document.getElementById('pnote');note.innerHTML='';
  const stepsFor=(p.actions||[]).filter(a=>a.note).sort((a,b)=>a.t-b.t);
  stepsFor.forEach(s=>{
    const li=document.createElement('li');li.textContent=s.note;
    li.onclick=()=>{setPlaying(false);T=s.t;draw(T);};
    ol.appendChild(li);
  });
  if(p.check){const d=document.createElement('div');d.className='callout';
    d.textContent=p.check;note.appendChild(d);}
  renderStage(p);
  document.getElementById('legend').innerHTML=(p.type==='info')?'':
    `<span><i style="background:#EAF7FF;border:2px solid #5FD3F3"></i>us</span>
     <span><i style="background:#8E2438;border:2px solid #E86B7F"></i>them</span>
     <span><i style="background:#F5A524"></i>ball</span>
     <span><i style="background:none;border:2px dotted #5FD3F3"></i>running line</span>
     <span><i style="background:none;border:2px dashed #F5A524"></i>decoy line</span>
     <span><i style="background:none;border-top:2.5px solid #F5A524;height:0;border-radius:0"></i>miss pass</span>`;
}
buildCats();buildChips();select(PLAYS[0]);
</script>
